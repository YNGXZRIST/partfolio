        - heading "О себе" [level=3] [ref=f11e132]
        - paragraph [ref=f11e134]: "Бэкенд-разработчик с упором на Go, highload и AI. Проектирую сервисы и REST/gRPC API, работаю с PostgreSQL, MySQL, Redis и RabbitMQ. Пишу на Go и PHP (Yii, Laravel), при необходимости делаю фронтенд на Vue.js. За плечами — highload-платформа автоматизации контекстной рекламы, которую я развивал и поддерживал: от фоновых воркеров и биллинга до систем анализа рекламных кампаний и автоматических аудитов."
        - heading "Код и AI" [level=3] [ref=f11e135]
        - paragraph [ref=f11e137]: "Отдельно люблю задачи на стыке кода и AI: строю интеграции с LLM, MCP-системы и ИИ-ассистентов, занимаюсь оркестрацией агентов и пишу кастомные скиллы. Мне интересно превращать «умные» модели в реальные рабочие инструменты, которые экономят людям время."
        - heading "Подход к работе" [level=3] [ref=f11e138]
        - paragraph [ref=f11e140]: "Веду задачу полным циклом: согласование ТЗ и сбор требований, оценка и согласование сроков, выбор технических решений и архитектуры, разработка и вывод в продакшен. Ценю чистый и поддерживаемый код, продумываю архитектуру и не маскирую баги, а ищу их корневую причину. Привык брать ответственность за результат и общаться с заказчиком напрямую."
        - heading "Бэкграунд" [level=3] [ref=f11e141]
        - paragraph [ref=f11e143]: Окончил бакалавриат БФУ им. И. Канта по направлению «Прикладная математика и информатика». Математическая база помогает мне в задачах, где важны алгоритмы, аналитика и работа с данными.
