            - paragraph [ref=f15e233]: Микросервис для загрузки, хранения, асинхронной обработки и раздачи аватарок пользователей. Пользователь один раз загружает изображение, а сторонние платформы получают его в нужном размере по REST API. Оригинал сохраняется в S3, метаданные — в PostgreSQL, а миниатюры 100×100 и 300×300 генерируются асинхронно через RabbitMQ и отдельный worker.
