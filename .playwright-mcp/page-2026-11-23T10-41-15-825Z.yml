            - paragraph [ref=f17e229]: server кладёт оригинал в S3 и в одной транзакции пишет запись аватарки и событие в таблицу outbox. publisher вычитывает неопубликованные события и шлёт их в RabbitMQ. consumer генерирует миниатюры или удаляет файлы, обновляя статус pending → running → success/failed. Сообщения с ошибкой уходят в DLQ.
        - generic [ref=f17e230]:
