        - paragraph [ref=f1e132]: server кладёт оригинал в S3 и в одной транзакции пишет запись аватарки и событие в таблицу outbox. publisher вычитывает неопубликованные события и шлёт их в RabbitMQ. consumer генерирует миниатюры или удаляет файлы, обновляя статус pending → running → success/failed. Сообщения с ошибкой уходят в DLQ.
      - heading "Технические детали" [level=2] [ref=f1e133]
      - generic [ref=f1e134]:
        - paragraph [ref=f1e135]: Микросервис для загрузки, хранения, асинхронной обработки и раздачи аватарок пользователей. Пользователь один раз загружает изображение, а сторонние платформы получают его в нужном размере по REST API. Оригинал сохраняется в S3, метаданные — в PostgreSQL, а миниатюры 100×100 и 300×300 генерируются асинхронно через RabbitMQ и отдельный worker.
        - list [ref=f1e136]:
          - listitem [ref=f1e137]: Transactional Outbox — запись в БД и постановка события в очередь в одной транзакции (at-least-once)
          - listitem [ref=f1e138]: Идемпотентные обработчики и отдельные очереди DLX / DLQ для «отравленных» сообщений
          - listitem [ref=f1e139]: Асинхронная генерация миниатюр и удаление файлов через worker
          - listitem [ref=f1e140]: Health-check БД, S3 и брокера
          - listitem [ref=f1e141]: HTTP на голом stdlib net/http (ServeMux, Go 1.22 patterns), условные запросы ETag / 304
          - listitem [ref=f1e142]: SQL-миграции на golang-migrate, всё окружение — в Docker Compose
