<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Василий Кулагин — Backend-разработчик · Go</title>
  <meta name="description" content="Портфолио Василия Кулагина: Go, highload, распределённые системы, AI.">
  <link rel="icon" href="/assets/apple.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
  <script>
    // Тема до первой отрисовки, чтобы не мигало: сохранённый выбор или как в системе.
    (function () {
      var t = null
      try { t = localStorage.getItem('theme') } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      document.documentElement.dataset.theme = t
    })()
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
